name: Cloud support offline structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify portfolio structure and fixture syntax
        run: python scripts/verify_offline.py
      - name: Check internal README references
        run: python scripts/check_readme_links.py
      - name: Check Python syntax and offline data regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Check shell script syntax
        run: find . -type f -name '*.sh' -exec bash -n {} \;
